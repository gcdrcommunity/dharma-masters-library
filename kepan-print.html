<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>《解脫莊嚴寶論》科判總覽</title>
<style>
  :root{
    --primary:#7D4A4A; --secondary:#8B5A52; --accent:#A68566;
    --border:#DCC9B6; --bg:#FEFDFB; --light-bg:#F5F0E8; --text:#4A3C3C;
  }
  *{box-sizing:border-box;}
  body{
    font-family:"Noto Serif TC","Songti TC","Source Han Serif TC",serif;
    color:var(--text); background:var(--bg); margin:0; padding:24px;
    max-width:820px; margin:0 auto; line-height:1.5;
  }
  .doc-title{font-size:1.6em;color:var(--primary);font-weight:700;text-align:center;margin:0 0 .2em;}
  .doc-sub{text-align:center;color:var(--secondary);font-size:.95em;margin:0 0 .2em;}
  .doc-note{text-align:center;color:var(--accent);font-size:.8em;margin:0 0 1.4em;}
  .toolbar{text-align:center;margin-bottom:1.2em;}
  .toolbar button{
    font:inherit;font-size:.9em;cursor:pointer;color:#fff;background:var(--primary);
    border:none;border-radius:6px;padding:.5em 1.1em;
  }
  .lvl{display:flex;flex-direction:column;gap:.28em;}
  .children{margin:.28em 0 .1em .5em;padding-left:.6em;border-left:1.5px solid var(--border);}
  .row{display:flex;align-items:baseline;gap:.5em;padding:.32em .5em;border:1px solid var(--border);
       border-radius:6px;background:var(--bg);break-inside:avoid;}
  .row.group{background:var(--light-bg);border-style:dashed;font-weight:600;color:var(--primary);}
  .label{flex:0 0 auto;min-width:2.6em;text-align:center;font-size:.8em;font-weight:700;
         color:var(--primary);background:var(--light-bg);border-radius:4px;padding:.05em .35em;}
  .group .label{background:rgba(125,74,74,.1);}
  .ttl{flex:1 1 auto;}
  .ch{flex:0 0 auto;font-size:.72em;color:var(--accent);border:1px solid var(--border);
      border-radius:3px;padding:.02em .35em;white-space:nowrap;}
  @media print{
    body{padding:0;max-width:none;}
    .toolbar{display:none;}
    .row{box-shadow:none;}
    @page{size:A4;margin:14mm;}
  }
</style>
</head>
<body>
  <div class="doc-title">《解脫莊嚴寶論》科判總覽</div>
  <div class="doc-sub">岡波巴大師 造　·　大乘菩提道次第論</div>
  <div class="doc-note">全書依「因、所依、緣、方便、果、事業」六義開展</div>
  <div class="toolbar"><button onclick="window.print()">🖨 列印 / 存成 PDF</button></div>
  <div id="tree"></div>
<script>
function esc(t){return (t||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
function nodesHtml(nodes){
  let h='<div class="lvl">';
  nodes.forEach(n=>{
    const hasCh=n.ch!=null;
    const label=n.label?`<span class="label">${esc(n.label)}</span>`:'';
    const ttl=`<span class="ttl">${esc(n.title)}</span>`;
    const badge=hasCh?`<span class="ch">第${n.ch}章</span>`:'';
    const cls='row'+(hasCh?'':' group');
    h+=`<div class="node"><div class="${cls}">${label}${ttl}${badge}</div>`;
    if(n.children) h+=`<div class="children">${nodesHtml(n.children)}</div>`;
    h+='</div>';
  });
  return h+'</div>';
}
fetch('data/kepan.json').then(r=>r.json()).then(k=>{
  document.getElementById('tree').innerHTML=nodesHtml(k['jewel-ornament-of-liberation'].nodes);
});
</script>
</body>
</html>
