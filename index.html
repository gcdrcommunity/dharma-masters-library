<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="color-scheme" content="light">
    <meta name="supported-color-schemes" content="light">
    <title>祖師教言文庫</title>
    <link rel="stylesheet" href="assets/css/style.css?v=3">
    <style>
        html {
            scroll-behavior: smooth;
        }

        .reader-tools {
            margin: 18px 0 16px;
            border: 1px solid rgba(122, 92, 58, 0.18);
            border-radius: 14px;
            background: rgba(250, 247, 240, 0.72);
            overflow: hidden;
        }

        .reader-tools-summary {
            list-style: none;
            cursor: pointer;
            padding: 12px 14px;
            color: #6e4f2a;
            font-size: 0.95rem;
            font-weight: 600;
            user-select: none;
        }

        .reader-tools-summary::-webkit-details-marker {
            display: none;
        }

        .reader-tools-summary::before {
            content: "▸";
            display: inline-block;
            margin-right: 8px;
            transition: transform 0.2s ease;
        }

        .reader-tools[open] .reader-tools-summary::before {
            transform: rotate(90deg);
        }

        .reader-tools-hint {
            margin-left: 8px;
            font-weight: 400;
            font-size: 0.85rem;
            color: #8a7358;
        }

        .reader-tools-body {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            padding: 0 12px 12px;
        }

        .reader-tools button {
            appearance: none;
            border: 1px solid rgba(122, 92, 58, 0.35);
            border-radius: 999px;
            background: #fffaf2;
            color: #6e4f2a;
            font-size: 0.95rem;
            line-height: 1;
            padding: 10px 14px;
            cursor: pointer;
        }

        .reader-tools button:hover,
        .reader-tools button:focus-visible {
            background: #f4ead8;
            outline: none;
        }

        .reader-tools button:disabled {
            opacity: 0.45;
            cursor: not-allowed;
        }

        .voice-select-label {
            align-self: center;
            font-size: 0.92rem;
            color: #6e4f2a;
            margin-left: 2px;
        }

        .voice-select {
            min-width: min(100%, 260px);
            max-width: 100%;
            border: 1px solid rgba(122, 92, 58, 0.35);
            border-radius: 999px;
            background: #fffaf2;
            color: #6e4f2a;
            font-size: 0.92rem;
            line-height: 1;
            padding: 9px 32px 9px 12px;
        }

        .voice-select:focus-visible {
            outline: 2px solid rgba(122, 92, 58, 0.32);
            outline-offset: 2px;
        }

        .reader-status {
            flex-basis: 100%;
            min-height: 1.4em;
            font-size: 0.88rem;
            color: #8a7358;
        }

        .chapter-tools {
            margin: 10px 0 16px;
            border: 1px solid rgba(122, 92, 58, 0.18);
            border-radius: 14px;
            background: rgba(250, 247, 240, 0.72);
            overflow: hidden;
        }

        .chapter-tools-summary {
            list-style: none;
            cursor: pointer;
            padding: 12px 14px;
            color: #6e4f2a;
            font-size: 0.95rem;
            font-weight: 600;
            user-select: none;
        }

        .chapter-tools-summary::-webkit-details-marker {
            display: none;
        }

        .chapter-tools-summary::before {
            content: "▸";
            display: inline-block;
            margin-right: 8px;
            transition: transform 0.2s ease;
        }

        .chapter-tools[open] .chapter-tools-summary::before {
            transform: rotate(90deg);
        }

        .chapter-tools-hint {
            margin-left: 8px;
            font-weight: 400;
            font-size: 0.85rem;
            color: #8a7358;
        }

        .chapter-tools .chapters {
            padding: 0 12px 12px;
        }

        /* 正文／目錄分頁：閱讀區上方、優雅底線式（去外框） */
        .nav-tabs-reading {
            gap: 1.6em;
            margin: 10px 0 0;
            padding-bottom: 0.5em;
        }
        .nav-tabs-reading .nav-tab {
            font-size: 1.12rem;
            font-weight: 600;
            padding: 0.3em 0.15em;
            border: none;
            background: transparent;
            color: var(--secondary);
            border-radius: 0;
            border-bottom: 2px solid transparent;
        }
        .nav-tabs-reading .nav-tab.active,
        .nav-tabs-reading .nav-tab:hover {
            background: transparent;
            color: var(--primary);
            border-color: transparent;
            border-bottom: 2px solid var(--primary);
        }
    </style>
</head>
<body>
    <div id="homeView" class="view active">
        <header>
            <div class="container">
                <h1 data-site-title>祖師教言文庫</h1>
                <div class="site-subtitle" data-site-subtitle></div>
                <p class="site-description" data-site-description></p>
            </div>
        </header>

        <main class="container" id="homeContainer">
            <div class="loading">資料載入中……</div>
        </main>

        <footer>
            <p data-site-footer>祖師教言文庫 | 光明洲實修中心</p>
        </footer>
    </div>

    <div id="readerView" class="view">
        <header>
            <div class="container reader-header">
                <button class="back-btn" onclick="goHome()">← 返回首頁</button>
                <h1 id="readerTitle"></h1>
            </div>
        </header>

        <main class="container">
            <details class="chapter-tools" aria-label="選擇章節">
                <summary class="chapter-tools-summary">
                    選擇章節
                    <span class="chapter-tools-hint">點開切換章節</span>
                </summary>
                <div class="chapters" id="chaptersList"></div>
            </details>

            <details class="reader-tools" aria-label="朗讀工具">
                <summary class="reader-tools-summary">
                    朗讀工具
                    <span class="reader-tools-hint">點開選擇聲音與播放</span>
                </summary>
                <div class="reader-tools-body">
                    <label class="voice-select-label" for="voiceSelect">聲音</label>
                    <select id="voiceSelect" class="voice-select" aria-label="選擇朗讀聲音">
                        <option value="">自動選擇繁體中文聲音</option>
                    </select>
                    <button type="button" id="readAloudBtn">朗讀本頁</button>
                    <button type="button" id="rewindBtn" disabled>⏮ 後退</button>
                    <button type="button" id="pauseReadBtn" disabled>暫停</button>
                    <button type="button" id="resumeReadBtn" disabled>繼續</button>
                    <button type="button" id="forwardBtn" disabled>快轉 ⏭</button>
                    <button type="button" id="stopReadBtn" disabled>停止</button>
                    <div class="reader-status" id="readerStatus" aria-live="polite">預設會自動選擇繁體中文聲音；也可以手動指定。</div>
                </div>
            </details>

            <div class="nav-tabs nav-tabs-reading">
                <button class="nav-tab active" data-tab="text" onclick="switchTab('text', event)">正文</button>
                <button class="nav-tab" data-tab="toc" onclick="switchTab('toc', event)">目錄</button>
            </div>

            <article id="textPanel" class="content-panel active"></article>
            <aside id="tocPanel" class="content-panel">
                <ul class="toc-list" id="tocList"></ul>
            </aside>
        </main>

        <button id="backToTop" class="back-to-top" title="返回頂部">↑ 返回頂部</button>

        <footer>
            <p data-site-footer>祖師教言文庫 | 光明洲實修中心</p>
        </footer>
    </div>

    <div id="noteModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <span id="noteTitle"></span>
                <button class="close-btn" onclick="closeNote()">&times;</button>
            </div>
            <div class="modal-body" id="noteBody"></div>
        </div>
    </div>

    <script src="assets/js/app.js?v=3"></script>
    <script>
        (function () {
            const chapterTools = document.querySelector('.chapter-tools');
            const chaptersList = document.getElementById('chaptersList');

            if (chapterTools && chaptersList) {
                chaptersList.addEventListener('click', function (event) {
                    const chapterControl = event.target.closest('button, a');
                    if (!chapterControl) return;
                    window.setTimeout(function () {
                        chapterTools.removeAttribute('open');
                    }, 200);
                });
            }
        })();

        (function () {
            const synth = window.speechSynthesis;
            const readBtn = document.getElementById('readAloudBtn');
            const rewindBtn = document.getElementById('rewindBtn');
            const forwardBtn = document.getElementById('forwardBtn');
            const pauseBtn = document.getElementById('pauseReadBtn');
            const resumeBtn = document.getElementById('resumeReadBtn');
            const stopBtn = document.getElementById('stopReadBtn');
            const voiceSelect = document.getElementById('voiceSelect');
            const status = document.getElementById('readerStatus');
            const textPanel = document.getElementById('textPanel');
            const VOICE_STORAGE_KEY = 'dml-reader-voice';

            let chunks = [];
            let chunkIndex = 0;
            let currentUtterance = null;
            let isReading = false;
            let voices = [];

            if (!synth || !window.SpeechSynthesisUtterance) {
                if (status) status.textContent = '此瀏覽器暫不支援網頁朗讀功能。';
                if (readBtn) readBtn.disabled = true;
                if (voiceSelect) voiceSelect.disabled = true;
                return;
            }

            function setStatus(message) {
                if (status) status.textContent = message || '';
            }

            function setControls(state) {
                const reading = state === 'reading';
                const paused = state === 'paused';
                readBtn.disabled = reading;
                pauseBtn.disabled = !reading;
                resumeBtn.disabled = !paused;
                stopBtn.disabled = !(reading || paused);
                if (rewindBtn) rewindBtn.disabled = !(reading || paused);
                if (forwardBtn) forwardBtn.disabled = !(reading || paused);
            }

            function getReadableText() {
                if (!textPanel) return '';
                const clone = textPanel.cloneNode(true);
                clone.querySelectorAll('script, style, button, nav, .footnote-ref, .footnote-backref').forEach(el => el.remove());
                return clone.textContent
                    .replace(/\s+/g, ' ')
                    .replace(/([。！？；：])\s*/g, '$1\n')
                    .trim();
            }

            function splitText(text) {
                const sentences = text
                    .replace(/([。！？；：.!?])/g, '$1|')
                    .split('|')
                    .map(sentence => sentence.trim())
                    .filter(Boolean);
                const result = [];
                let buffer = '';

                sentences.forEach(sentence => {
                    if ((buffer + sentence).length > 180 && buffer) {
                        result.push(buffer.trim());
                        buffer = sentence;
                    } else {
                        buffer += sentence;
                    }
                });

                if (buffer.trim()) result.push(buffer.trim());
                return result;
            }

            function voiceLabel(voice) {
                if (!voice) return '瀏覽器預設聲音';
                return voice.name + (voice.lang ? '（' + voice.lang + '）' : '');
            }

            function isChineseVoice(voice) {
                const text = ((voice && voice.name) || '') + ' ' + ((voice && voice.lang) || '');
                return /zh[-_]/i.test(text) || /Chinese|Mandarin|中文|國語|美佳|Mei[-\s]?Jia/i.test(text);
            }

            function scoreVoice(voice) {
                const name = (voice.name || '').toLowerCase();
                const lang = (voice.lang || '').toLowerCase();
                let score = 0;

                if (/zh[-_]?tw/i.test(lang) || /zh[-_]?hant/i.test(lang)) score += 120;
                else if (/zh[-_]?(hk|mo)/i.test(lang)) score += 95;
                else if (/^zh/i.test(lang)) score += 70;

                if (/mei[-\s]?jia|美佳/i.test(voice.name)) score += 90;
                if (/google/i.test(name) && /^zh/i.test(lang)) score += 45;
                if (/premium|enhanced|高品質|進階|siri/i.test(name)) score += 30;
                if (/taiwan|臺灣|台灣|traditional|繁體/i.test(name + ' ' + lang)) score += 25;
                if (/chinese|mandarin|中文|國語/i.test(voice.name)) score += 15;

                return score;
            }

            function getBestChineseVoice() {
                const chineseVoices = voices.filter(isChineseVoice);
                if (!chineseVoices.length) return null;
                return chineseVoices.sort((a, b) => scoreVoice(b) - scoreVoice(a))[0];
            }

            function getSelectedVoice() {
                if (voiceSelect && voiceSelect.value) {
                    const selected = voices.find(voice => voice.name + '|' + voice.lang === voiceSelect.value);
                    if (selected) return selected;
                }
                return getBestChineseVoice();
            }

            function populateVoiceSelect() {
                voices = synth.getVoices ? synth.getVoices() : [];
                if (!voiceSelect) return;

                const savedVoice = localStorage.getItem(VOICE_STORAGE_KEY) || '';
                const selectedValue = voiceSelect.value || savedVoice;

                voiceSelect.innerHTML = '';

                const autoOption = document.createElement('option');
                autoOption.value = '';
                autoOption.textContent = '自動選擇繁體中文聲音';
                voiceSelect.appendChild(autoOption);

                if (!voices.length) {
                    const loadingOption = document.createElement('option');
                    loadingOption.value = '__loading';
                    loadingOption.textContent = '聲音載入中，請稍候';
                    loadingOption.disabled = true;
                    voiceSelect.appendChild(loadingOption);
                    voiceSelect.value = '';
                    return;
                }

                // 只列中文聲音（移除非中文選項）
                const chineseVoices = voices
                    .filter(isChineseVoice)
                    .sort((a, b) => scoreVoice(b) - scoreVoice(a) || voiceLabel(a).localeCompare(voiceLabel(b)));

                chineseVoices.forEach(voice => {
                    const option = document.createElement('option');
                    option.value = voice.name + '|' + voice.lang;
                    option.textContent = voiceLabel(voice);
                    voiceSelect.appendChild(option);
                });

                if (!chineseVoices.length) {
                    const noneOption = document.createElement('option');
                    noneOption.value = '__none';
                    noneOption.textContent = '（此裝置未安裝中文聲音）';
                    noneOption.disabled = true;
                    voiceSelect.appendChild(noneOption);
                }

                if (selectedValue && chineseVoices.some(voice => voice.name + '|' + voice.lang === selectedValue)) {
                    voiceSelect.value = selectedValue;
                } else {
                    voiceSelect.value = '';
                }
            }

            function describeCurrentVoice() {
                const selected = getSelectedVoice();
                if (voiceSelect && voiceSelect.value && selected) {
                    return '已選擇：' + voiceLabel(selected);
                }
                if (selected) {
                    return '自動選擇：' + voiceLabel(selected);
                }
                return '使用瀏覽器預設聲音。';
            }

            function speakNext() {
                if (!isReading || chunkIndex >= chunks.length) {
                    stopReading('朗讀完成。');
                    return;
                }

                currentUtterance = new SpeechSynthesisUtterance(chunks[chunkIndex]);
                currentUtterance.lang = 'zh-TW';
                currentUtterance.rate = 0.9;
                currentUtterance.pitch = 1;

                const voice = getSelectedVoice();
                if (voice) {
                    currentUtterance.voice = voice;
                    currentUtterance.lang = voice.lang || 'zh-TW';
                }

                currentUtterance.onend = function () {
                    if (!isReading) return;
                    chunkIndex += 1;
                    speakNext();
                };

                currentUtterance.onerror = function () {
                    if (!isReading) return;
                    stopReading('朗讀中斷，請再點一次「朗讀本頁」。');
                };

                setStatus(describeCurrentVoice() + ' 正在朗讀第 ' + (chunkIndex + 1) + ' 段，共 ' + chunks.length + ' 段。');
                synth.speak(currentUtterance);
            }

            function startReading() {
                populateVoiceSelect();
                const text = getReadableText();
                if (!text) {
                    setStatus('目前頁面還沒有可朗讀的正文。');
                    return;
                }

                synth.cancel();
                chunks = splitText(text);
                chunkIndex = 0;
                isReading = true;
                setControls('reading');
                speakNext();
            }

            function pauseReading() {
                if (synth.speaking && !synth.paused) {
                    synth.pause();
                    setControls('paused');
                    setStatus('已暫停朗讀。');
                }
            }

            function resumeReading() {
                if (synth.paused) {
                    synth.resume();
                    setControls('reading');
                    setStatus('繼續朗讀。');
                }
            }

            function stopReading(message) {
                isReading = false;
                synth.cancel();
                currentUtterance = null;
                setControls('idle');
                setStatus(message || '已停止朗讀。');
            }

            if (voiceSelect) {
                voiceSelect.addEventListener('change', function () {
                    if (voiceSelect.value) {
                        localStorage.setItem(VOICE_STORAGE_KEY, voiceSelect.value);
                        setStatus(describeCurrentVoice());
                    } else {
                        localStorage.removeItem(VOICE_STORAGE_KEY);
                        setStatus(describeCurrentVoice());
                    }

                    if (isReading) {
                        stopReading('聲音設定已變更，請重新點「朗讀本頁」。');
                    }
                });
            }

            // 後退／快轉：以「段」為單位跳到上一段／下一段
            function skipRead(delta) {
                if (!chunks.length) return;
                isReading = false;        // 阻止當前語句 onend 自動前進
                synth.cancel();
                chunkIndex = Math.min(chunks.length - 1, Math.max(0, chunkIndex + delta));
                isReading = true;
                setControls('reading');
                speakNext();
            }

            readBtn.addEventListener('click', startReading);
            rewindBtn.addEventListener('click', () => skipRead(-1));
            forwardBtn.addEventListener('click', () => skipRead(1));
            pauseBtn.addEventListener('click', pauseReading);
            resumeBtn.addEventListener('click', resumeReading);
            stopBtn.addEventListener('click', () => stopReading('已停止朗讀。'));

            document.addEventListener('visibilitychange', function () {
                if (document.hidden && isReading) stopReading('已停止朗讀。');
            });

            const observer = new MutationObserver(function () {
                if (isReading) stopReading('章節已切換，朗讀已停止。');
            });

            if (textPanel) {
                observer.observe(textPanel, { childList: true, subtree: true, characterData: true });
            }

            populateVoiceSelect();
            setTimeout(populateVoiceSelect, 250);
            setTimeout(function () {
                populateVoiceSelect();
                if (status && !isReading) setStatus(describeCurrentVoice() + ' 可以開始朗讀。');
            }, 1000);

            if (synth.onvoiceschanged !== undefined) {
                synth.onvoiceschanged = function () {
                    populateVoiceSelect();
                    if (status && !isReading) setStatus(describeCurrentVoice() + ' 可以開始朗讀。');
                };
            }

        })();
    </script>
</body>
</html>
