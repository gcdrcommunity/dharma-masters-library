<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <!-- 國際佛旗五色：藍、黃、紅、白、橙（直條）。圓角框確保白條在淺色分頁列也看得見。 -->
  <defs>
    <clipPath id="round"><rect x="1" y="1" width="30" height="30" rx="6" ry="6"/></clipPath>
  </defs>
  <g clip-path="url(#round)">
    <rect x="1"    y="1" width="6"   height="30" fill="#005BAC"/>
    <rect x="7"    y="1" width="6"   height="30" fill="#FFCE00"/>
    <rect x="13"   y="1" width="6"   height="30" fill="#D8161E"/>
    <rect x="19"   y="1" width="6"   height="30" fill="#FFFFFF"/>
    <rect x="25"   y="1" width="6"   height="30" fill="#F58220"/>
  </g>
  <rect x="1" y="1" width="30" height="30" rx="6" ry="6" fill="none" stroke="#7a5c3a" stroke-opacity="0.55" stroke-width="1.5"/>
</svg>
